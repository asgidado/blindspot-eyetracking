[project]
name = "blindspot-gaze"
version = "0.1.0"
description = "Standalone webcam eye-tracking for the Blindspot chest X-ray perception trainer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
]

[project.optional-dependencies]
films = [
  "huggingface-hub>=0.23",
  "torch>=2.2",
  "torchxrayvision>=1.2",
  "scikit-image>=0.22",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_analysis", "mock", "shared"]

[tool.pytest.ini_options]
testpaths = ["gaze_analysis", "mock", "shared", "tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
